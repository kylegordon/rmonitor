services:
  # On-premise relay: connects to the rMonitor timing feed and forwards
  # parsed messages to the server via HTTP POST.
  relay:
    image: ghcr.io/kylegordon/rmonitor-relay:latest
    environment:
      - RMONITOR_HOST=${RMONITOR_HOST:-192.168.10.24}
      - RMONITOR_PORT=${RMONITOR_PORT:-50000}
      - SERVER_URL=${SERVER_URL:-http://server:8080}
      - RELAY_SECRET=${RELAY_SECRET}
    depends_on:
      - server
    restart: unless-stopped

  # Cloud server: receives data from the relay, maintains race state,
  # and serves the live timing web UI.
  server:
    image: ghcr.io/kylegordon/rmonitor-server:latest
    ports:
      - "8080:8080"
    environment:
      - RELAY_SECRET=${RELAY_SECRET}
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8080
      - STATE_FILE=/data/state.json
    volumes:
      - ./data:/data
    restart: unless-stopped

  # Optional: expose the server through a Cloudflare Tunnel.
  # Set CLOUDFLARE_TUNNEL_TOKEN in your environment or a .env file, then run:
  #   docker compose --profile tunnel up
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - server
    restart: unless-stopped

  # The test suite. Not part of a plain `docker compose up` — the `test` profile
  # keeps it out. The repo is bind-mounted rather than COPYed because
  # tests/test_integration.py resolves examples/ from __file__. Normally invoked
  # through ./test.sh, which adds the uid mapping and the --build flag.
  #
  # `image:` is set explicitly with the version in the tag: Compose would otherwise
  # name the build <project>-tests, so a 3.12 and a 3.13 run would overwrite one
  # another's cached image and each rebuild from the apt layer.
  tests:
    image: rmonitor-test:${PYTHON_VERSION:-3.12}
    profiles:
      - test
    build:
      context: .
      dockerfile: tests/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    volumes:
      - .:/opt/app
