name: Publish Docker Images (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v0.1.2)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-relay:
    name: Build and push relay image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rmonitor-relay
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: relay/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=relay
          cache-to: type=gha,scope=relay,mode=max

  build-server:
    name: Build and push server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rmonitor-server
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

  build-relay-binaries:
    name: Build relay GUI binaries (manual/unreleased test build)
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python3-tk and binutils (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk binutils

      - name: Install dependencies
        run: pip install -r relay/requirements.txt -r relay/requirements-build.txt

      - name: Generate relay/_version.py from VERSION
        run: echo "CURRENT_VERSION = \"${{ github.event.inputs.tag }}\"" > relay/_version.py

      - name: Build with PyInstaller
        # --hidden-import: PIL.ImageTk locates PIL._tkinter_finder at runtime
        # (never a static import PyInstaller's analysis can trace) to bind
        # Pillow's image buffers to the running Tcl/Tk install; without it
        # the built binary crashes on startup building ttkbootstrap's styles.
        # --collect-data: ttkbootstrap ships its widget images/icon font as
        # package data rather than Python modules.
        run: >-
          pyinstaller --onefile --windowed --name rmonitor-relay-gui
          --hidden-import PIL._tkinter_finder
          --collect-data ttkbootstrap
          relay/gui.py

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: mv dist/rmonitor-relay-gui.exe dist/rmonitor-relay-gui-windows-x64.exe

      - name: Rename binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: mv dist/rmonitor-relay-gui dist/rmonitor-relay-gui-linux-x64

      # Manual/unreleased testing build: this workflow has no publish-release
      # job and no guarantee a GitHub Release exists for the given tag input,
      # so the binary is uploaded as a workflow artifact rather than attached
      # to a release (release.yml's build-relay-binaries job does the
      # release-asset attachment for real releases).
      - name: Upload binary as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmonitor-relay-gui-${{ matrix.os }}
          path: |
            dist/rmonitor-relay-gui-windows-x64.exe
            dist/rmonitor-relay-gui-linux-x64
          if-no-files-found: ignore
