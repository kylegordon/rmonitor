name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The same image ./test.sh builds locally. libtk8.6, Xvfb and
      # REQUIRE_DISPLAY=1 are all baked into it, so there is no apt step, no Xvfb
      # step and no pip install here — one definition of the test environment.
      #
      # load: true is mandatory. Without it (and with no push) the image stays in
      # the buildx cache only, and the run step fails to find it locally.
      #
      # The layer cache is scoped per interpreter: both matrix legs build from the
      # same Dockerfile, so a shared scope would have them overwrite each other's
      # layers on every run — a permanently cold cache.
      - name: Build test image for Python ${{ matrix.python-version }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/Dockerfile
          build-args: PYTHON_VERSION=${{ matrix.python-version }}
          tags: rmonitor-test:${{ matrix.python-version }}
          load: true
          cache-from: type=gha,scope=test-${{ matrix.python-version }}
          cache-to: type=gha,scope=test-${{ matrix.python-version }},mode=max

      - name: Run tests
        run: docker run --rm -v "$PWD":/opt/app rmonitor-test:${{ matrix.python-version }} tests/ -v

  # Deliberately a sibling of `test` rather than a step inside it: the script is
  # stdlib-only, so it needs neither the container build nor anything installed,
  # and inside the 3.12/3.13 matrix it would run twice for one answer.
  agents-md:
    name: Instruction files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check AGENTS.md, CLAUDE.md and the Copilot pointer
        run: python .github/scripts/check_agents_md.py
