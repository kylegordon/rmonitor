<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>SMART Timing TV</title>
  <style>
    /* A broadcast overlay, taken in as a 1920x1080 browser source and keyed over the
       circuit feed. The page leaves its backdrop unset, because OBS and vMix keep the
       alpha only while it is. Everything sits inside the EBU R 95 graphics-safe area
       (5%: 96 px left, 54 px top). */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
    }
    #overlay {
      position: absolute;
      left: 96px;
      top: 54px;
      width: 460px;
      transition: opacity 0.5s;
    }
    /* Off air, or on air with no cars to list: a bare header is not worth keying. */
    #overlay.off-air, #overlay.no-entries { opacity: 0; }

    #tv-header {
      position: relative;
      height: 64px;
      margin-bottom: 8px;
      padding: 14px 16px 0;
      background: rgba(15, 15, 30, 0.85);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    #flag-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 8px;
    }
    .flag-green { background: #2ecc40; }
    .flag-yellow { background: #ffdc00; }
    .flag-red { background: #ff4136; }
    .flag-purple { background: #9b59b6; }
    .flag-finish {
      background: repeating-conic-gradient(#fff 0 25%, #111 0 50%) 0 0 / 8px 8px;
    }
    .flag-unknown { background: #777; }
    #race-name {
      font-size: 18px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #laps-or-time {
      font-size: 18px;
      white-space: nowrap;
      color: #ddd;
    }

    #tower { position: relative; }
    /* Position numbers hold still in their own column while the driver rows slide
       behind it, so the order reads mid-move. */
    #slots {
      position: absolute;
      top: 0;
      left: 0;
      width: 44px;
      z-index: 10;
    }
    .tv-slot {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #15151e;
      border-bottom: 1px solid rgba(21, 21, 30, 0.12);
      font-weight: 700;
      font-size: 20px;
    }
    .tv-slot.empty { visibility: hidden; }
    /* A car that gained places moves first and rides over the cars it passed; those
       follow 0.12s later underneath. */
    .tv-row {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      padding-left: 44px;
      display: flex;
      align-items: center;
      background: rgba(15, 15, 30, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-weight: 700;
      font-size: 20px;
      text-transform: uppercase;
      z-index: 2;
      transition: transform 0.7s cubic-bezier(0.3, 0, 0.2, 1) 0.12s,
        background-color 0.8s ease-out, box-shadow 0.8s ease-out, opacity 0.4s;
      will-change: transform;
    }
    .tv-row.losing { z-index: 1; }
    .tv-row.gaining { z-index: 3; transition-delay: 0s; }
    .tv-row.lift {
      background: rgba(38, 44, 78, 0.97);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.55);
      transition-duration: 0.7s, 0.2s, 0.2s, 0.4s;
    }
    /* `translate` is separate from `transform`, so the nudge never fights the slide. */
    .tv-row.pass { animation: pull-out 0.82s ease-in-out; }
    @keyframes pull-out {
      0% { translate: 0 0; }
      45% { translate: 20px 0; }
      100% { translate: 0 0; }
    }
    .tv-class {
      width: 6px;
      height: 100%;
    }
    .tv-class.hidden { visibility: hidden; }
    .tv-number {
      width: 56px;
      text-align: center;
      color: #ccc;
    }
    .tv-name {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tv-delta {
      width: 44px;
      text-align: center;
      font-size: 16px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .tv-delta.show { opacity: 1; }
    .tv-delta.up { color: #2ecc40; }
    .tv-delta.down { color: #ff4136; }
    .tv-fl {
      width: 14px;
      height: 14px;
      margin: 0 10px;
      border-radius: 50%;
      visibility: hidden;
    }
    .tv-row.fastest-lap .tv-fl {
      visibility: visible;
      background: #9b59b6;
    }
    .tv-interval {
      width: 130px;
      padding-right: 14px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #eee;
    }

    @media (prefers-reduced-motion: reduce) {
      .tv-row { transition: none; }
      .tv-row.pass { animation: none; }
      #overlay { transition: none; }
    }
  </style>
</head>
<body>
  <div id="overlay" class="off-air">
    <div id="tv-header">
      <div id="flag-bar" class="flag-unknown"></div>
      <div id="race-name"></div>
      <div id="laps-or-time"></div>
    </div>
    <div id="tower"></div>
  </div>

  <script>
    // Unattended: no one is at this browser, so it has no buttons, prompts or
    // connection indicator. It draws the server's snapshot as sent -- entries in
    // server order, sort_mode, fastest_lap and status read, never re-derived.
    const ROW_H = 44;
    const clamp = (n, lo, hi) => Math.min(Math.max(n, lo), hi);
    const ROWS = clamp(parseInt(new URLSearchParams(location.search).get('rows'), 10) || 20, 1, 20);

    const overlayEl = document.getElementById('overlay');
    const flagBarEl = document.getElementById('flag-bar');
    const raceNameEl = document.getElementById('race-name');
    const lapsOrTimeEl = document.getElementById('laps-or-time');
    const towerEl = document.getElementById('tower');
    towerEl.style.height = (ROWS * ROW_H) + 'px';

    const slotsEl = document.createElement('div');
    slotsEl.id = 'slots';
    const slots = [];
    for (let i = 0; i < ROWS; i++) {
      const slot = document.createElement('div');
      slot.className = 'tv-slot empty';
      slotsEl.appendChild(slot);
      slots.push(slot);
    }
    towerEl.appendChild(slotsEl);

    let rowMap = {};
    // Each row's index in the last snapshot drawn, and its pending move timers.
    let lastIdx = {};
    let moveTimers = {};
    let lastSortMode = null;
    const LIFT_MS = 900;
    const MARKER_MS = 3000;
    let knownServerInstanceId = null;
    let revealTimer = null;

    // A connect during an outage gets a stale `full` and then `no_feed`, so a
    // `full` reveals only after a short wait that `no_feed` or a close cancels.
    const REVEAL_DELAY_MS = 750;

    function goOffAir() {
      clearTimeout(revealTimer);
      revealTimer = null;
      overlayEl.classList.add('off-air');
    }

    function goOnAir() {
      clearTimeout(revealTimer);
      revealTimer = null;
      overlayEl.classList.remove('off-air');
    }

    function flagClass(flag) {
      const f = (flag || '').toLowerCase();
      if (f.includes('green')) return 'flag-green';
      if (f.includes('yellow') || f.includes('caution')) return 'flag-yellow';
      if (f.includes('red')) return 'flag-red';
      if (f.includes('purple')) return 'flag-purple';
      if (f.includes('finish')) return 'flag-finish';
      return 'flag-unknown';
    }

    // Same format as index.html's Gap/Diff: a lap deficit wins over a time.
    function intervalText(seconds, laps) {
      if (laps != null) return '+' + laps + ' L';
      if (seconds == null) return '—';
      const sign = seconds < 0 ? '-' : '+';
      const abs = Math.abs(seconds);
      if (abs < 60) return sign + abs.toFixed(3);
      const mins = Math.floor(abs / 60);
      const secs = abs - mins * 60;
      return sign + mins + ':' + secs.toFixed(3).padStart(6, '0');
    }

    // Laps to go takes priority over time to go, as on index.html; the feed's
    // 0 and 9999 laps and a zero clock are not meaningful.
    function lapsOrTime(data) {
      const ltg = data.laps_to_go;
      const ttg = data.time_to_go || '';
      if (ltg && ltg !== '0' && ltg !== '9999') return `${ltg} LAPS TO GO`;
      if (ttg && ttg !== '0:00:00' && ttg !== '00:00:00') return ttg;
      return '';
    }

    // A best lap, blank for a reset's zero and the feed's no-time sentinel, as
    // index.html's totalText() withholds them.
    function lapText(t) {
      if (!t || t === '00:00:00.000' || t === '00:59:59.999') return '';
      return t;
    }

    const CLASS_PALETTE = [
      '#e10600', '#00d2be', '#ff8700', '#0090ff',
      '#ffd700', '#2ecc40', '#ff69b4', '#b0b0b0',
    ];

    // A fixed colour per class code, the same on every load.
    function classColour(code) {
      if (!code) return '';
      let h = 0;
      for (let i = 0; i < code.length; i++) h = (h * 31 + code.charCodeAt(i)) >>> 0;
      return CLASS_PALETTE[h % CLASS_PALETTE.length];
    }

    function makeRow() {
      const row = document.createElement('div');
      row.className = 'tv-row';
      for (const cls of ['tv-class', 'tv-number', 'tv-name', 'tv-delta', 'tv-fl', 'tv-interval']) {
        const cell = document.createElement('div');
        cell.className = cls;
        row.appendChild(cell);
      }
      return row;
    }

    function cell(row, cls) {
      return row.querySelector('.' + cls);
    }

    function clearMoveTimers(key) {
      const timers = moveTimers[key];
      if (timers) {
        clearTimeout(timers.lift);
        clearTimeout(timers.marker);
      }
      delete moveTimers[key];
    }

    // Ends a row's marked move at once: no lift, nudge or marker left on it.
    function clearMove(key) {
      clearMoveTimers(key);
      const row = rowMap[key];
      row.classList.remove('gaining', 'losing', 'pass', 'lift');
      cell(row, 'tv-delta').classList.remove('show');
    }

    // Marks a row that changed places since the last snapshot: a gainer lifts,
    // nudges right and draws over the rows it passed; either way a green or red
    // marker shows the places gained or lost for a few seconds.
    function markMove(key, row, gained) {
      const marker = cell(row, 'tv-delta');
      const up = gained > 0;
      row.classList.toggle('gaining', up);
      row.classList.toggle('losing', !up);
      marker.textContent = (up ? '▲' : '▼') + Math.abs(gained);
      marker.className = 'tv-delta show ' + (up ? 'up' : 'down');
      if (up) {
        row.classList.remove('pass');
        void row.offsetWidth;  // restarts the nudge when a row gains again mid-move
        row.classList.add('pass', 'lift');
      } else {
        row.classList.remove('pass', 'lift');
      }
      clearMoveTimers(key);
      moveTimers[key] = {
        lift: setTimeout(() => row.classList.remove('lift'), LIFT_MS),
        marker: setTimeout(() => clearMove(key), MARKER_MS),
      };
    }

    function removeRow(key) {
      clearMoveTimers(key);
      rowMap[key].remove();
      delete rowMap[key];
      delete lastIdx[key];
    }

    // Moves are marked only on a live `update`; a `full` resyncs after an outage
    // and `init` starts a session, so neither is a change of places on track.
    // Within an update, a change of sort_mode reorders the whole tower, and the
    // purple flag's total_time order is crossing order, so neither is marked
    // either. A best_lap climb is a real improvement in qualifying, so it is.
    function render(data, markMoves) {
      const sortMode = data.sort_mode;
      markMoves = markMoves && sortMode === lastSortMode && sortMode !== 'total_time';
      lastSortMode = sortMode;
      // A reorder that is not marked must not show a move left over from the
      // last update either.
      if (!markMoves) Object.keys(moveTimers).forEach(clearMove);
      flagBarEl.className = flagClass(data.flag);
      lapsOrTimeEl.textContent = lapsOrTime(data);
      const raceName = data.race_name || '';
      raceNameEl.textContent = raceName;
      raceNameEl.style.display = raceName ? '' : 'none';

      const entries = (data.entries || []).slice(0, ROWS);
      overlayEl.classList.toggle('no-entries', !entries.length);
      const bestLapSort = data.sort_mode === 'best_lap';
      const showClass = !!data.class_codes_available;
      const seen = new Set();

      entries.forEach((e, idx) => {
        const key = String(e.reg_number);
        seen.add(key);
        let row = rowMap[key];
        const y = `translateY(${idx * ROW_H}px)`;
        if (!row) {
          // Placed before it is shown, so a new row fades in where it belongs
          // rather than sliding down from the top.
          row = makeRow();
          row.style.transform = y;
          row.style.opacity = '0';
          towerEl.appendChild(row);
          rowMap[key] = row;
          requestAnimationFrame(() => { row.style.opacity = '1'; });
        } else {
          const gained = lastIdx[key] - idx;
          if (markMoves && gained) markMove(key, row, gained);
          row.style.transform = y;
        }
        lastIdx[key] = idx;

        slots[idx].textContent = bestLapSort ? String(idx + 1) : (e.position || '');
        slots[idx].classList.remove('empty');
        cell(row, 'tv-number').textContent = e.number || e.reg_number;
        cell(row, 'tv-name').textContent = (e.last_name || e.first_name || '').toUpperCase();

        const strip = cell(row, 'tv-class');
        const colour = showClass ? classColour(e.class_code) : '';
        strip.style.background = colour;
        strip.classList.toggle('hidden', !colour);

        row.classList.toggle('fastest-lap', !!e.fastest_lap);

        let interval;
        if (e.status) {
          interval = e.status;
        } else if (bestLapSort) {
          interval = lapText(e.best_lap_time);
        } else {
          interval = intervalText(e.gap_ahead_seconds, e.gap_ahead_laps);
          if (interval === '—') interval = '';
        }
        cell(row, 'tv-interval').textContent = interval;
      });

      for (let i = entries.length; i < ROWS; i++) {
        slots[i].textContent = '';
        slots[i].classList.add('empty');
      }

      for (const key of Object.keys(rowMap)) {
        if (!seen.has(key)) removeRow(key);
      }
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${proto}//${location.host}/ws`);

      ws.onclose = () => {
        goOffAir();
        setTimeout(connect, 2000);
      };

      ws.onerror = () => ws.close();

      ws.onmessage = (evt) => {
        const msg = JSON.parse(evt.data);

        // A restart, deploys included, reloads unconditionally: no one is here to
        // answer a prompt, and a brief blank on air at each deploy is accepted.
        if (msg.server_instance_id !== undefined) {
          if (knownServerInstanceId === null) {
            knownServerInstanceId = msg.server_instance_id;
          } else if (msg.server_instance_id !== knownServerInstanceId) {
            window.location.reload();
            return;
          }
        }

        if (msg.event === 'full') {
          render(msg.data, false);
          if (overlayEl.classList.contains('off-air') && revealTimer === null) {
            revealTimer = setTimeout(goOnAir, REVEAL_DELAY_MS);
          }
        } else if (msg.event === 'update') {
          goOnAir();
          render(msg.data, true);
        } else if (msg.event === 'init') {
          goOnAir();
          Object.keys(rowMap).forEach(removeRow);
          render(msg.data, false);
        } else if (msg.event === 'no_feed') {
          goOffAir();
        }
      };
    }

    connect();
  </script>
</body>
</html>
